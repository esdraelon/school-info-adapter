# Build backend: setuptools (src layout). Chosen for M0 because its
# editable-install + package-dir handling is the most battle-tested of the
# options; hatchling remains a drop-in alternative if we ever want it.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-info-adapter"
version = "0.1.0"
description = "School Information Adapter: pluggable source drivers feeding normalized due-item (Driver) and material (Resource) records, exposed as an MCP on hal9k."
requires-python = ">=3.11"
# Runtime dependencies: the official MCP Python SDK (FastMCP) for the
# M4 server, and uvicorn to serve its ASGI app (imported directly by
# school.mcp_server.server, so declared rather than left transitive).
# M6 adds playwright (Classroom browser driver; imports stay local to
# school.driver_classroom_web so the browser binaries are only needed
# where a session actually starts) and cryptography (the vault's
# AES-256-GCM envelope encryption).
dependencies = [
    "mcp>=1.16,<2",
    "uvicorn>=0.30",
    "playwright>=1.40",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "coverage",
    "mypy",
    "httpx",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# --- Quality gates (all enforced by scripts/verify.sh) ---

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

# Coverage gate (C6): >=90% line coverage of the school package, measured
# over the unit tests only. `coverage report` exits non-zero below this.
[tool.coverage.run]
source = ["school"]

[tool.coverage.report]
fail_under = 90
show_missing = true

# Type gate (C6): mypy strict over the whole package.
[tool.mypy]
strict = true
